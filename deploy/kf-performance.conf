# Install in /etc/nginx/conf.d/ before the site configuration is loaded.
# Only public startup resources and named API paths are recorded. No query
# strings, IP addresses, cookies, request bodies or attachment paths are logged.
map $uri $kf_perf_loggable {
    default 0;
    / 1;
    /style.css 1;
    /app.js 1;
    /healthz 1;
    /api/session 1;
    /api/messages 1;
    /network-check.html 1;
    /network-check.js 1;
}
map $arg_speed_check $kf_perf_id {
    default "";
    "~^[0-9a-f-]{36}$" $arg_speed_check;
}
log_format kf_performance escape=json
    '{"time":"$time_iso8601","path":"$uri","status":$status,'
    '"request_s":$request_time,"upstream_connect_s":"$upstream_connect_time",'
    '"upstream_header_s":"$upstream_header_time","upstream_response_s":"$upstream_response_time",'
    '"bytes":$body_bytes_sent,"protocol":"$server_protocol",'
    '"connection":"$connection","connection_requests":$connection_requests,'
    '"check_id":"$kf_perf_id"}';
