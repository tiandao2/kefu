server {
    listen 80 default_server;
    server_name kf.wgioat.cn;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / {
        return 301 https://kf.wgioat.cn$request_uri;
    }
}
server {
    listen 443 ssl default_server;
    http2 on;
    # kf-performance.conf must be installed into /etc/nginx/conf.d/ first.
    access_log /var/log/nginx/access.log combined;
    access_log /var/log/nginx/kf-performance.log kf_performance if=$kf_perf_loggable;
    server_name kf.wgioat.cn;
    ssl_certificate /etc/letsencrypt/live/kf.wgioat.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kf.wgioat.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    gzip on;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_vary on;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    client_max_body_size 21m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location = /telegram/webhook {
        include /etc/nginx/snippets/kf-telegram-sources.conf;
        include /etc/nginx/snippets/kf-proxy.conf;
    }
    # Only the exact callback above is accepted. Case/trailing-path variants
    # must not reach the general proxy without the Telegram source allowlist.
    location ~* ^/telegram(?:/|$) { return 404; }
    location / {
        include /etc/nginx/snippets/kf-proxy.conf;
    }
}
